    <!-- Theme: applied before first paint so the page never flashes the wrong
         surface. Mirrors the logic in src/lib/theme.js. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F7F9" media="(prefers-color-scheme: light)" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("untrace-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          if (theme === "light")
            document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
